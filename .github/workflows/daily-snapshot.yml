# .github/workflows/daily-snapshot.yml

name: Daily Snapshot Updater
on:
  schedule:
    - cron: "0 3 * * *" # every day 03:00 UTC
  workflow_dispatch:

jobs:
  update_snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger snapshot update
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            ${{ secrets.NEXT_PUBLIC_BASE_URL }}/api/cron