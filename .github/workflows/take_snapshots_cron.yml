name: Take Snapshots Daily

on:
  schedule:
    - cron: "0 0 * * *"  # every day 00:00 UTC
  workflow_dispatch: {}   # allow manual run from GitHub UI

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Function
        run: |
          curl -X POST "https://orybvrxrlehjactaflwo.functions.supabase.co/take-snapshots" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}" \
            -H "Content-Type: application/json" \
            --data "{}"
